<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スラムダンク検定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap&text=正解！" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <header class="header">スラムダンク検定</header>
  <div class="stats">
    <div><span class="label">前回の結果</span><span id="last-score" class="value">－</span></div>
    <div><span class="label">最高得点</span><span id="best-score" class="value">－</span></div>
  </div>
  <main id="chat" class="chat"></main>
  <div id="controls" class="controls"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js";
  // Firebase設定（config.js は .gitignore 済み）
  import { firebaseConfig } from "./config.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ===== 定数 =====
  // 各問題で出題する難易度の範囲 [最小, 最大]（この範囲の問題からランダムに1問）
  const ROUNDS = [
    [1, 2],  // 第1問
    [3, 4],  // 第2問
    [5, 6],  // 第3問
    [7, 9],  // 第4問
    [10, 10] // 第5問
  ];
  const TOTAL_QUESTIONS = ROUNDS.length; // 5問
  const MAX_DIFFICULTY = 10;
  const NEXT_WAIT_MS = 1500;    // 判定表示後、次の問題までのウェイト
  const ATTEMPT_SHOW_MS = 1500; // 回答直後にシュート画像を見せる時間

  const SHOT_IMG = {
    attempt: "imgs/shot_attempt.jpeg",
    made: "imgs/shot_made.jpeg",
    missed: "imgs/shot_missed.jpg",
  };
  // 表示時に読み込み待ちが出ないよう、先に読み込んでおく
  Object.values(SHOT_IMG).forEach((src) => { new Image().src = src; });

  // ===== 状態 =====
  let quizCache = null; // 難易度ごとの問題配列 { 1: [...], 2: [...], ... }
  let score = 0;
  let current = 1;      // 現在の問題番号（1〜5）

  const chatEl = document.getElementById("chat");
  const controlsEl = document.getElementById("controls");

  // アイコン処理（firebase_add.pdf の方式）
  // 0: Bot（左）、1: ユーザー（右）
  const img = ["basketring2.png", "basketball_2.png"];
  const ICON = { bot: 0, user: 1 };

  // アイコン＋吹き出しの1行を作ってチャットに追加し、吹き出し要素を返す
  function addRow(who, bubbleClass) {
    const icon = ICON[who];
    let str = '<div class="row ' + who + '">';
    str += '<img class="icon" src="imgs/' + img[icon] + '" width="50">';
    str += '<div class="' + bubbleClass + '"></div>';
    str += '</div>';
    chatEl.insertAdjacentHTML("beforeend", str);
    chatEl.scrollTop = chatEl.scrollHeight; // 自動で最下部へスクロール
    return chatEl.lastElementChild.querySelector(".msg");
  }

  // Botの画像メッセージを追加し、<img> 要素を返す（あとで src を差し替えられる）
  function addImage(src, alt) {
    const bubble = addRow("bot", "msg bot shot");
    const shot = document.createElement("img");
    shot.src = src;
    shot.alt = alt;
    shot.addEventListener("load", () => { chatEl.scrollTop = chatEl.scrollHeight; });
    bubble.appendChild(shot);
    return shot;
  }

  // ===== 成績の保存（LocalStorage） =====
  // 保存するのは正解数のみ。高校レベルは表示時に getRank() で求める
  // 10問版の記録と混ざらないよう、5問版は別のキーで保存する
  const STORAGE_LAST = "slamdunk5_last_score";
  const STORAGE_BEST = "slamdunk5_best_score";

  function loadScore(key) {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    const n = Number(v);
    return Number.isInteger(n) && n >= 0 && n <= TOTAL_QUESTIONS ? n : null;
  }

  const formatScore = (n) =>
    n === null ? "－" : `${TOTAL_QUESTIONS}問中 ${n}問正解（${getRank(n)}）`;

  function renderStats() {
    document.getElementById("last-score").textContent = formatScore(loadScore(STORAGE_LAST));
    document.getElementById("best-score").textContent = formatScore(loadScore(STORAGE_BEST));
  }

  // 今回の結果を保存し、最高得点を更新したら true を返す
  function saveScore(n) {
    localStorage.setItem(STORAGE_LAST, String(n));
    const best = loadScore(STORAGE_BEST);
    const isNewBest = best === null || n > best;
    if (isNewBest) localStorage.setItem(STORAGE_BEST, String(n));
    renderStats();
    return isNewBest;
  }

  // ===== UIヘルパー =====
  function addMessage(text, who = "bot", extraClass = "") {
    const bubble = addRow(who, `msg ${who} ${extraClass}`.trim());
    bubble.textContent = text; // 文字はタグとして解釈させないため textContent で入れる
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ボタンを表示。押されたらユーザー吹き出しを出し、全ボタンを非活性にしてから onSelect を呼ぶ
  function showButtons(labels, onSelect) {
    controlsEl.innerHTML = "";
    labels.forEach((label) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = label;
      btn.addEventListener("click", () => {
        controlsEl.querySelectorAll("button").forEach((b) => (b.disabled = true)); // 二重送信防止
        addMessage(label, "user");
        onSelect(label);
      });
      controlsEl.appendChild(btn);
    });
  }

  function clearButtons() {
    controlsEl.innerHTML = "";
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // ===== データ取得（初回のみ一括取得してメモリにキャッシュ） =====
  // RealtimeDatabase の配列はオブジェクトで返ることがあるため、どちらでも扱えるようにする
  const toArray = (v) => (Array.isArray(v) ? v : Object.values(v || {})).filter((x) => x != null);

  async function loadQuizzes() {
    if (quizCache) return quizCache;
    const snapshot = await get(ref(db, "quizzes"));
    if (!snapshot.exists()) throw new Error("quizzes にデータがありません");

    const byDifficulty = {};
    toArray(snapshot.val()).forEach((q) => {
      const d = Number(q.difficulty);
      const choices = toArray(q.choices).map(String);
      if (!(d >= 1 && d <= MAX_DIFFICULTY) || !q.question || choices.length === 0) return;
      (byDifficulty[d] ||= []).push({ difficulty: d, question: q.question, choices, answer: String(q.answer) });
    });

    for (let d = 1; d <= MAX_DIFFICULTY; d++) {
      if (!byDifficulty[d]?.length) throw new Error(`難易度${d}の問題がありません`);
    }
    quizCache = byDifficulty;
    return quizCache;
  }

  // ===== 状態1：開始確認 =====
  function askStart() {
    addMessage("スラムダンク検定、やりますか？");
    showButtons(["はい", "いいえ"], (ans) => {
      if (ans === "はい") startQuiz();
      else askStart(); // 「はい」以外 → 初期状態を維持
    });
  }

  // ===== 状態2：クイズ進行 =====
  async function startQuiz() {
    score = 0;
    current = 1;
    try {
      if (!quizCache) addMessage("問題を読み込んでいます…");
      await loadQuizzes();
    } catch (err) {
      console.error(err);
      addMessage(`問題の読み込みに失敗しました。（${err.message}）`);
      askStart();
      return;
    }
    askQuestion();
  }

  function askQuestion() {
    // この問題の難易度範囲に入る問題をすべて集め、その中からランダムに1問選ぶ
    const [min, max] = ROUNDS[current - 1];
    const pool = [];
    for (let d = min; d <= max; d++) pool.push(...quizCache[d]);
    const q = pool[Math.floor(Math.random() * pool.length)];

    addMessage(`第${current}問（難易度${q.difficulty}）：${q.question}`);
    showButtons(q.choices, async (choice) => {
      // 回答した瞬間：シュート中の画像を1.5秒表示
      const shot = addImage(SHOT_IMG.attempt, "シュート！");
      await wait(ATTEMPT_SHOW_MS);

      // 同じ吹き出しの画像を、成功／失敗の画像に差し替える
      if (choice === q.answer) {
        score++;
        shot.src = SHOT_IMG.made;
        shot.alt = "シュート成功";
        addMessage("正解！", "bot", "correct");
      } else {
        shot.src = SHOT_IMG.missed;
        shot.alt = "シュート失敗";
        addMessage(`不正解…（正解：${q.answer}）`, "bot", "wrong");
      }

      await wait(NEXT_WAIT_MS);

      if (current < TOTAL_QUESTIONS) {
        current++;
        askQuestion();
      } else {
        showResult();
      }
    });
  }

  // ===== 状態3：結果発表・リトライ確認 =====
  function getRank(n) {
    const ranks = ["三浦台", "津久武", "翔陽", "海南", "山王", "湘北"]; // 0問〜5問正解
    return ranks[Math.min(Math.max(n, 0), ranks.length - 1)];
  }

  function showResult() {
    clearButtons();
    const prevBest = loadScore(STORAGE_BEST);
    addMessage(`${TOTAL_QUESTIONS}問中 ${score}問正解しました！ あなたは『${getRank(score)}』レベルです。`);
    if (saveScore(score) && prevBest !== null) {
      addMessage(`最高得点を更新しました！（${prevBest}問 → ${score}問）`, "bot", "correct");
    }
    addMessage("リトライしますか？");
    showButtons(["はい", "いいえ"], (ans) => {
      if (ans === "はい") startQuiz();
      else askStart(); // 「はい」以外 → 初期状態へ
    });
  }

  // ===== 起動 =====
  renderStats();
  askStart();
</script>

</body>
</html>
